<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 420" width="1560" height="420">
  <rect width="1560" height="420" rx="22" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- STEP 1: 安装并复制网址 -->
  <g transform="translate(36, 36)">
    <rect width="456" height="348" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="24" y="22" width="38" height="38" rx="19" fill="#064E3B"/>
    <text x="43" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="800" fill="#34D399">1</text>
    <text x="76" y="49" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="25" font-weight="700" fill="#F0F6FC">启动 · 复制地址</text>

    <!-- Mini App Window -->
    <g transform="translate(24, 82)">
      <rect width="408" height="236" rx="14" fill="#0B1120" stroke="#1F2937" stroke-width="1.5"/>
      <circle cx="22" cy="20" r="5" fill="#EF4444"/>
      <circle cx="39" cy="20" r="5" fill="#F59E0B"/>
      <circle cx="56" cy="20" r="5" fill="#10B981"/>
      <text x="76" y="25" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#8B949E">WebAI2PC</text>

      <!-- Green running pill -->
      <rect x="22" y="50" width="128" height="30" rx="15" fill="#064E3B"/>
      <circle cx="40" cy="65" r="5" fill="#10B981"/>
      <text x="54" y="70" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#34D399">服务已就绪</text>

      <!-- URL Box + Copy Button -->
      <rect x="22" y="100" width="364" height="58" rx="12" fill="#111827" stroke="#10B981" stroke-width="2"/>
      <text x="38" y="135" font-family="Consolas, SFMono-Regular, monospace" font-size="18" font-weight="600" fill="#F0F6FC">https://***.srv.us/mcp</text>
      <rect x="292" y="111" width="82" height="36" rx="9" fill="#10B981"/>
      <text x="333" y="135" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">复制</text>

      <!-- Subtle cursor -->
      <path d="M358 148 L358 178 L366 171 L373 184 L379 181 L372 168 L382 167 Z" fill="#F0F6FC" stroke="#0D1117" stroke-width="1.5"/>

      <!-- Minimal bottom hint -->
      <text x="22" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#8B949E">双击解压包启动，零命令行</text>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <g transform="translate(504, 210)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 -10 L38 0 L26 10" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STEP 2: 粘贴到 Gemini / ChatGPT -->
  <g transform="translate(552, 36)">
    <rect width="456" height="348" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="24" y="22" width="38" height="38" rx="19" fill="#172554"/>
    <text x="43" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="800" fill="#60A5FA">2</text>
    <text x="76" y="49" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="25" font-weight="700" fill="#F0F6FC">粘贴进网页 AI</text>

    <!-- Mini Browser Connector UI -->
    <g transform="translate(24, 82)">
      <rect width="408" height="236" rx="14" fill="#0B1120" stroke="#1F2937" stroke-width="1.5"/>

      <!-- Gemini + ChatGPT badges -->
      <g transform="translate(22, 22)">
