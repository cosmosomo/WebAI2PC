        <path d="M26 11 C26 18 30 23 37 23 C30 23 26 28 26 35 C26 28 22 23 15 23 C22 23 26 18 26 11 Z" fill="#3B82F6"/>
        <text x="48" y="29" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#F0F6FC">Gemini</text>
      </g>
      <g transform="translate(212, 22)">
        <rect width="174" height="46" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1.2"/>
        <g transform="translate(16, 11) scale(1.0)">
          <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z" fill="#10B981"/>
        </g>
        <text x="50" y="29" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#F0F6FC">ChatGPT</text>
      </g>

      <!-- Paste field -->
      <rect x="22" y="90" width="364" height="52" rx="11" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
      <text x="38" y="122" font-family="Consolas, SFMono-Regular, monospace" font-size="17" fill="#F0F6FC">https://***.srv.us/mcp</text>
      <rect x="302" y="101" width="72" height="30" rx="8" fill="#172554"/>
      <text x="338" y="121" text-anchor="middle" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#60A5FA">粘贴</text>

      <!-- Allow button -->
      <rect x="22" y="160" width="364" height="48" rx="12" fill="#3B82F6"/>
      <text x="204" y="191" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">贴入配置栏，勿浏览器直开</text>
    </g>
  </g>

  <!-- ARROW 2 -> 3 -->
  <g transform="translate(1020, 210)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 -10 L38 0 L26 10" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- STEP 3: 直接操作你的电脑 -->
  <g transform="translate(1068, 36)">
    <rect width="456" height="348" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="24" y="22" width="38" height="38" rx="19" fill="#064E3B"/>
    <text x="43" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" font-weight="800" fill="#34D399">3</text>
    <text x="76" y="49" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="25" font-weight="700" fill="#F0F6FC">直接操作你的电脑</text>

    <!-- Local PC + Phone visual -->
    <g transform="translate(24, 82)">
      <rect width="408" height="236" rx="14" fill="#0B1120" stroke="#1F2937" stroke-width="1.5"/>

      <!-- Desktop PC screen -->
      <rect x="24" y="26" width="248" height="156" rx="12" fill="#111827" stroke="#1F2937" stroke-width="2"/>
      <!-- Base -->
