      <path d="M54 63 L64 71 L54 79" fill="none" stroke="#10B981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="70" y1="79" x2="86" y2="79" stroke="#10B981" stroke-width="2.6" stroke-linecap="round"/>
      <text x="98" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#F0F6FC">终端</text>

      <!-- Code / Files -->
      <rect x="154" y="44" width="102" height="54" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
      <rect x="166" y="59" width="20" height="24" rx="3" fill="none" stroke="#3B82F6" stroke-width="2.2"/>
      <line x1="171" y1="67" x2="181" y2="67" stroke="#3B82F6" stroke-width="2"/>
      <line x1="171" y1="74" x2="178" y2="74" stroke="#3B82F6" stroke-width="2"/>
      <text x="196" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#F0F6FC">代码</text>

      <!-- Office bar -->
      <rect x="40" y="110" width="216" height="54" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/>
      <rect x="54" y="124" width="54" height="26" rx="6" fill="#172554"/>
      <text x="81" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#60A5FA">Word</text>
      <rect x="118" y="124" width="58" height="26" rx="6" fill="#064E3B"/>
      <text x="147" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#34D399">Excel</text>
      <rect x="186" y="124" width="56" height="26" rx="6" fill="#172554"/>
      <text x="214" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#60A5FA">PPT</text>

      <!-- Phone synced on right -->
      <rect x="298" y="42" width="84" height="154" rx="16" fill="#111827" stroke="#10B981" stroke-width="2.2"/>
      <rect x="326" y="52" width="28" height="4" rx="2" fill="#1F2937"/>
      <circle cx="340" cy="96" r="16" fill="#064E3B"/>
      <path d="M333 96 L338 101 L348 91" fill="none" stroke="#10B981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="340" y="138" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#F0F6FC">手机同步</text>
      <text x="340" y="160" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#34D399">● 远程可用</text>

      <text x="24" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#8B949E">改文件、跑脚本、改 Office，随时可撤回</text>
