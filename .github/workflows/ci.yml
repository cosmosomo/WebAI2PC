name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-release-gate:
    name: Pytest & Release Gate (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      LOCALPC_NO_BROWSER: "1"
      COSMOS_NO_TRAY: "1"
      COSMOS_EXTRA_FORBIDDEN_TOKENS: ${{ secrets.COSMOS_EXTRA_FORBIDDEN_TOKENS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev]"

      - name: Run fast preflight & release hygiene gate
        run: python -B scripts/ci_preflight.py

      - name: Run full test suite (Windows / Python 3.12)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        run: python -B -m pytest -p no:cacheprovider -q tests/

      - name: Run backend test suite (Windows / Python 3.11)
        if: runner.os == 'Windows' && matrix.python-version != '3.12'
        run: python -B -m pytest -p no:cacheprovider -q -k "not headless" tests/

      - name: Run full test suite (POSIX / Python 3.12)
        if: runner.os != 'Windows' && matrix.python-version == '3.12'
        run: python -B -m pytest -p no:cacheprovider -q -k "not test_longest_prefix_readonly_parent_rw_child_and_l3_hook" tests/

      - name: Run backend test suite (POSIX / Python 3.11)
        if: runner.os != 'Windows' && matrix.python-version != '3.12'
        run: python -B -m pytest -p no:cacheprovider -q -k "not headless and not test_longest_prefix_readonly_parent_rw_child_and_l3_hook" tests/
