name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-release-gate:
    name: Pytest & Release Gate (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      LOCALPC_NO_BROWSER: "1"
      COSMOS_NO_TRAY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev]"

      - name: Run full test suite (Windows)
        if: runner.os == 'Windows'
        run: python -B -m pytest -p no:cacheprovider -q tests/

      - name: Run full test suite (POSIX)
        if: runner.os != 'Windows'
        run: python -B -m pytest -p no:cacheprovider -q tests/ -k "not test_longest_prefix_readonly_parent_rw_child_and_l3_hook"

      - name: Build release archive and run byte-level hygiene gate
        env:
          COSMOS_EXTRA_FORBIDDEN_TOKENS: ${{ secrets.COSMOS_EXTRA_FORBIDDEN_TOKENS }}
        run: |
          python -B scripts/build_release.py --check

