name: CI

on:
  push:
    branches: ["main", "ci/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-verified:
    name: Check Pre-Verified Commit Status
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      already_green: ${{ steps.probe.outputs.already_green }}
    steps:
      - name: Check if commit SHA already passed CI Gate on staging branch
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$TARGET_REF" = "refs/heads/main" ]; then
            COUNT=$(gh api "repos/${TARGET_REPO}/commits/${TARGET_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "CI Gate" and .status == "completed" and .conclusion == "success")] | length' 2>/dev/null || echo "0")
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "Commit ${TARGET_SHA} already verified by CI Gate; skipping duplicate matrix."
              echo "already_green=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "already_green=false" >> "$GITHUB_OUTPUT"

  test-and-release-gate:
    name: Pytest & Release Gate (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [check-verified]
    if: needs.check-verified.outputs.already_green != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      LOCALPC_NO_BROWSER: "1"
      COSMOS_NO_TRAY: "1"
      COSMOS_EXTRA_FORBIDDEN_TOKENS: ${{ secrets.COSMOS_EXTRA_FORBIDDEN_TOKENS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,dev]"

      - name: Run fast preflight & release hygiene gate
        run: python -B scripts/ci_preflight.py

      - name: Run full test suite (Windows / Python 3.12)
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        run: python -B -m pytest -p no:cacheprovider -q tests/

      - name: Run backend & contract test suite (Windows / Python 3.11)
        if: runner.os == 'Windows' && matrix.python-version != '3.12'
        run: python -B -m pytest -p no:cacheprovider -q --ignore=tests/test_studio_ui_hygiene.py --ignore=tests/test_multigw_studio_ui.py --ignore=tests/test_dogma_studio_conn_fixes.py -k "not headless and not login_window and not studio_ui and not studio_e2e" tests/

      - name: Run full test suite (POSIX / Python 3.12)
        if: runner.os != 'Windows' && matrix.python-version == '3.12'
        run: python -B -m pytest -p no:cacheprovider -q -k "not test_longest_prefix_readonly_parent_rw_child_and_l3_hook" tests/

      - name: Run backend & contract test suite (POSIX / Python 3.11)
        if: runner.os != 'Windows' && matrix.python-version != '3.12'
        run: python -B -m pytest -p no:cacheprovider -q --ignore=tests/test_studio_ui_hygiene.py --ignore=tests/test_multigw_studio_ui.py --ignore=tests/test_dogma_studio_conn_fixes.py -k "not headless and not login_window and not studio_ui and not studio_e2e and not test_longest_prefix_readonly_parent_rw_child_and_l3_hook" tests/

  ci-gate:
    name: CI Gate
    needs: [check-verified, test-and-release-gate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce all 6 OS x Python matrix jobs passed
        env:
          ALREADY_GREEN: ${{ needs.check-verified.outputs.already_green }}
          MATRIX_RESULT: ${{ needs.test-and-release-gate.result }}
        run: |
          if [ "$ALREADY_GREEN" = "true" ]; then
            echo "CI Gate passed (pre-verified commit)."
            exit 0
          fi
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::CI Gate blocked: matrix result was '${MATRIX_RESULT}'."
            exit 1
          fi
          echo "CI Gate passed (6/6 matrix jobs succeeded)."

  auto-promote-main:
    name: Auto-Promote Verified Commit to main
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/main' && needs.ci-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast-forward protected main to verified commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          MAIN_SHA=$(gh api "repos/${TARGET_REPO}/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN_SHA" = "$TARGET_SHA" ]; then
            echo "main is already at ${TARGET_SHA}."
            exit 0
          fi
          gh api --method PATCH "repos/${TARGET_REPO}/git/refs/heads/main" -f sha="${TARGET_SHA}" -F force=false
          echo "Promoted verified commit ${TARGET_SHA} onto refs/heads/main."
